<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Media is Ready</title>
  </head>
  <body
    style="margin:0; padding:0; font-family:'Poppins', sans-serif; background-color:#f7f7ff; color:#1e1e2d; line-height:1.6;"
  >
    <table width="100%" cellpadding="0" cellspacing="0" bgcolor="#f7f7ff">
      <tr>
        <td align="center" style="padding:20px;">
          <!-- Main container -->
          <table
            width="100%"
            max-width="600"
            cellpadding="20"
            cellspacing="0"
            style="max-width:600px; background:#ffffff; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); text-align:center;"
          >
            <!-- Logo & Header -->
            <tr>
              <td align="center" style="padding-bottom:20px;">
                <a href="https://lapsnaps.com/" target="_blank">
                  <img
                    src="https://lapsnaps.com/logo.png"
                    alt="Logo"
                    height="15"
                    style="display:block; margin:0 auto;"
                  />
                </a>
                <h2 style="font-size:20px; font-weight:600; margin:15px 0 5px;">
                  Hello, {{recipientName}}
                </h2>
                <p style="font-size:14px; color:#555555; margin:0;">
                  Thank you for your purchase! Your media assets are ready for
                  download. Click the button below to access them anytime.
                </p>
              </td>
            </tr>

            <!-- Download Button -->
            <tr>
              {{downloadLink}}
              <!-- <td style="padding-top:30px;">
                <a
                  href="{{downloadLink}}"
                  target="_blank"
                  style="background-color:#EE1E50; color:#ffffff; text-decoration:none; font-weight:500; font-size:14px; text-transform:uppercase; padding:12px 30px; border-radius:50px; display:inline-block;"
                >
                  Download Your Media
                </a>
              </td> -->
            </tr>

            <!-- Spacer -->
            <tr>
              <td style="height:40px;"></td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
