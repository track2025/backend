<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Your Password</title>
  </head>
  <body
    style="margin:0; padding:0; font-family:'Poppins', sans-serif; background-color:#f4f4f4; color:#1e1e2d; line-height:1.6;"
  >
    <table width="100%" cellpadding="0" cellspacing="0" bgcolor="#f4f4f4">
      <tr>
        <td align="center" style="padding:20px;">
          <table
            width="100%"
            max-width="480"
            cellpadding="0"
            cellspacing="0"
            style="max-width:480px; background:#ffffff; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.06); text-align:center; padding:30px 20px;"
          >
            <!-- Logo -->
            <tr>
              <td align="center" style="padding-bottom:20px;">
                <a href="https://lapsnaps.com/" target="_blank">
                  <img
                    src="https://lapsnaps.com/logo.png"
                    alt="Logo"
                    height="15"
                    style="display:block; margin:0 auto;"
                  />
                </a>
              </td>
            </tr>

            <!-- Heading -->
            <tr>
              <td>
                <h1
                  style="font-size:22px; color:#1e1e2d; font-weight:600; margin:0;"
                >
                  Reset Your Password
                </h1>
                <div
                  style="margin:20px auto; width:80px; border-bottom:1px solid #cecece;"
                ></div>
                <p
                  style="color:#555555; font-size:15px; line-height:24px; margin:0;"
                >
                  We received a request to reset your password. Click the button
                  below to set a new password for your account.
                </p>
              </td>
            </tr>

            <!-- Spacer -->
            <tr>
              <td style="padding-top:30px;">
                <a
                  href="javascript:void(0);"
                  target="_blank"
                  style="background-color:#EE1E50; color:#ffffff; text-decoration:none; font-weight:500; font-size:14px; text-transform:uppercase; padding:12px 30px; border-radius:50px; display:inline-block;"
                >
                  Reset Password
                </a>
              </td>
            </tr>

            <!-- Spacer -->
            <tr>
              <td style="height:40px;"></td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
