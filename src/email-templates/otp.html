<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Your Email</title>
  </head>
  <body
    style="margin:0; padding:0; font-family:'Poppins', sans-serif; background-color:#f4f4f4; color:#1e1e2d;"
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      bgcolor="#f4f4f4"
      style="padding:40px 0;"
    >
      <tr>
        <td align="center">
          <!-- OTP container -->
          <table
            width="100%"
            max-width="432"
            cellpadding="20"
            cellspacing="0"
            bgcolor="#ffffff"
            style="border-radius:8px; text-align:center;"
          >
            <!-- Logo -->
            <tr>
              <td align="center" style="padding-bottom:20px;">
                <a href="https://lapsnaps.com/" target="_blank">
                  <img
                    src="https://lapsnaps.com/logo.png"
                    alt="Logo"
                    height="15"
                    style="display:block; margin:0 auto;"
                  />
                </a>
              </td>
            </tr>

            <!-- Heading -->
            <tr>
              <td align="center">
                <h2
                  style="margin:0; margin-bottom:10px; font-size:22px; color:#1e1e2d;"
                >
                  Let’s Get You Signed Up
                </h2>
                <p style="color:#555555; font-size:14px; margin:0;">
                  Use the code below to complete your sign-up. This code will
                  expire in 60 seconds.
                </p>
              </td>
            </tr>

            <!-- OTP Code -->
            <tr>
              <td align="center" style="padding:20px 0;">
                <h1>
                  1 2 3 4 5 6
                </h1>
              </td>
            </tr>

            <!-- User email info -->
            <tr>
              <td align="center">
                <p style="color:#555555; font-size:14px; margin:0;">
                  This code is for signing up with usingyourmail@gmail.com .
                </p>
              </td>
            </tr>

            <!-- Footer note -->
            <tr>
              <td
                align="center"
                style="color:#999999; font-size:12px; padding-top:15px;"
              >
                If you didn’t request this code, you can safely ignore this
                email.
              </td>
            </tr>
          </table>

          <!-- End OTP container -->
        </td>
      </tr>
    </table>
  </body>
</html>
